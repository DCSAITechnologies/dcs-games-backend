# A7 — the first real CI for DCS Games. Round-2 found zero automated tests and no
# pipeline. Every job below is an exit gate from the Phase 1 survival foundation;
# a red job means a defect the audit already found has come back.
name: DCS Games CI

on:
  push:
    branches: [sprint/2026-09-canonical, main]
  pull_request:
  workflow_dispatch:

env:
  PAYMENTS_LIVE: "0"
  NODE_ENV: test

jobs:
  security:
    name: Security gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund

      - name: Secret scan
        run: node scripts/secret-scan.mjs .

      - name: Release verification (money dark, chain linear, seed quarantined)
        run: |
          if [ -f scripts/verify-release.mjs ]; then
            node scripts/verify-release.mjs
          else
            echo "verify-release.mjs not present yet"
          fi

      - name: Dependency audit
        run: npm audit --audit-level=high

      - name: Auth regression suite (the x-user-id impersonation must stay dead)
        run: node --test test/auth-principal.test.mjs

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund
      # test/harness-leak.test.mjs drives a real Chrome to prove the browser
      # harness leaves nothing running; without one it fails "no Chrome binary
      # found". Same install as the browser job.
      # Installed outside ~/.cache/puppeteer and handed over by DCS_CHROME: the
      # current installer writes a `.metadata` FILE into that cache, which the
      # helper's directory walk (test/helpers/browser.mjs) reads as a version
      # directory and dies on (ENOTDIR) — every browser suite, before a test.
      - name: Install Chrome for Testing
        run: |
          # ubuntu-24.04 runners restrict unprivileged user namespaces through
          # AppArmor, so Chrome's sandbox cannot start ("No usable sandbox").
          # Lift that on this throwaway runner and keep the sandbox ON — the
          # alternative, --no-sandbox, would test a browser nobody ships.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          out=$(npx --yes @puppeteer/browsers install chrome@stable --path "$RUNNER_TEMP/chrome" | tail -1)
          bin="${out#* }"
          test -x "$bin" || { echo "Chrome install did not yield an executable: $out"; exit 1; }
          echo "DCS_CHROME=$bin" >> "$GITHUB_ENV"
          "$bin" --version
      - name: Persistence, safety and auth
        run: npm run test:unit

  schema:
    name: Schema is reproducible
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
        ports: ["5432:5432"]
    env:
      DCS_PG_ADMIN_DSN: postgresql://postgres:postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund
      - name: Build staging schema from migrations only, then prove restore
        run: node --test test/schema-migrations.test.mjs

  api:
    name: API integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund
      - name: Boot the real server and exercise the Phase 1 gates
        run: npm run test:api

      - name: Post-deploy smoke against the freshly booted service
        run: |
          DCS_AUTH_SECRET=ci-secret DCS_DATA_DIR="$RUNNER_TEMP/dcs" PORT=8099 node --import tsx server.mts &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:8099/health >/dev/null && break; sleep 1; done
          node scripts/smoke.mjs http://127.0.0.1:8099

  frontend:
    name: Frontend truth gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      # INSIDE the workspace. `path: ../dcs-games-LIVE` was rejected by
      # actions/checkout (it refuses paths outside GITHUB_WORKSPACE) AND was one
      # level too shallow — and continue-on-error then swallowed the failure, so
      # the step below printed "not reachable" and the job passed having crawled
      # nothing. A gate that cannot fail is not a gate.
      - name: Check out the canonical frontend
        uses: actions/checkout@v4
        with:
          repository: DCSAITechnologies/dcs-games-frontend
          # Pinned to the staging candidate (games-staging-rc1): tip of
          # integration/dcs-games-frontend-internal-preview-30sep2026.
          ref: a10fec68b9a2089fc7b82d81d9e3e8ba64ff5cd6
          path: frontend
          # Read-only deploy key on dcs-games-frontend (private; github.token cannot read it).
          ssh-key: ${{ secrets.FRONTEND_DEPLOY_KEY }}
      - name: Diligence crawl — no fabricated public claim may reappear
        run: cd "$GITHUB_WORKSPACE/frontend" && node tools/diligence-crawl.mjs

  browser:
    name: Browser and flagship E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      # Without this the browser suites SKIP — measured on a clean clone: 83
      # tests, 0 passed, 83 skipped, exit 0. Every browser, accessibility,
      # performance and frontend-truth check had been silently off in CI for as
      # long as this job has existed. They now fail loudly when the site is
      # absent, and DCS_SITE_DIR is how CI says where it put it.
      - name: Check out the canonical frontend
        uses: actions/checkout@v4
        with:
          repository: DCSAITechnologies/dcs-games-frontend
          # Pinned to the staging candidate (games-staging-rc1): tip of
          # integration/dcs-games-frontend-internal-preview-30sep2026.
          ref: a10fec68b9a2089fc7b82d81d9e3e8ba64ff5cd6
          path: frontend
          # Read-only deploy key on dcs-games-frontend (private; github.token cannot read it).
          ssh-key: ${{ secrets.FRONTEND_DEPLOY_KEY }}
      - run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund
      # Installed outside ~/.cache/puppeteer and handed over by DCS_CHROME: the
      # current installer writes a `.metadata` FILE into that cache, which the
      # helper's directory walk (test/helpers/browser.mjs) reads as a version
      # directory and dies on (ENOTDIR) — every browser suite, before a test.
      - name: Install Chrome for Testing
        run: |
          # ubuntu-24.04 runners restrict unprivileged user namespaces through
          # AppArmor, so Chrome's sandbox cannot start ("No usable sandbox").
          # Lift that on this throwaway runner and keep the sandbox ON — the
          # alternative, --no-sandbox, would test a browser nobody ships.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          out=$(npx --yes @puppeteer/browsers install chrome@stable --path "$RUNNER_TEMP/chrome" | tail -1)
          bin="${out#* }"
          test -x "$bin" || { echo "Chrome install did not yield an executable: $out"; exit 1; }
          echo "DCS_CHROME=$bin" >> "$GITHUB_ENV"
          "$bin" --version
      - name: Runtime, truth and accessibility gates
        run: npm run test:browser
        env:
          DCS_SITE_DIR: ${{ github.workspace }}/frontend
        continue-on-error: false
      - name: Flagship end-to-end
        run: npm run test:e2e
        env:
          DCS_SITE_DIR: ${{ github.workspace }}/frontend
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-evidence
          path: evidence/            # inside the workspace; ../.. is rejected by upload-artifact
        continue-on-error: true

  netcode:
    name: Netcode anti-cheat
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      # The netcode service lives in its own repository, so it is checked out
      # explicitly. Previously this job looked for a sibling directory that is
      # never present in a CI checkout and printed a message when it was
      # missing — a check that always passed without running anything. A gate
      # that cannot fail is not a gate, and "we could not test the anti-cheat"
      # is not the same statement as "the anti-cheat is fine".
      - name: Check out the netcode service
        uses: actions/checkout@v4
        with:
          repository: DCSAITechnologies/dcs-games-netcode
          # Pinned. An unpinned branch means a CI-equivalent rebuild is not
          # reproducible: the netcode the pipeline tested yesterday is not
          # necessarily the netcode it tests today, and nothing records which.
          #
          # The previous pin, 524a7f61c373…, exists on NO ref in that repository
          # — `git fetch` answers "upload-pack: not our ref". So this job could
          # never check out and the anti-cheat gate has never actually run. It
          # failed loudly rather than silently, which is the right failure mode,
          # but the effect was the same as the sibling-directory check it
          # replaced: no anti-cheat evidence.
          #
          # Re-pinned 30 Sep 2026 to the staging candidate (games-staging-rc1):
          # tip of fix/games-c-netcode-closure. 20 suites green, including the
          # speedhack regression, the multiplayer flag-OFF proof and the
          # persistence-delta module this backend registers. (Previous pin
          # 49f1035, 7 Sep, predated the flag and the delta module.)
          ref: 347f44d1f2c9bae5891a026d39675c3750be0cf6
          path: netcode
      # The flag-OFF suite also scans the site for a multiplayer entrypoint, so
      # it needs the same pinned frontend the browser job tests.
      - name: Check out the canonical frontend
        uses: actions/checkout@v4
        with:
          repository: DCSAITechnologies/dcs-games-frontend
          ref: a10fec68b9a2089fc7b82d81d9e3e8ba64ff5cd6
          path: frontend
          # Read-only deploy key on dcs-games-frontend (private; github.token cannot read it).
          ssh-key: ${{ secrets.FRONTEND_DEPLOY_KEY }}
      # Catch a dead pin before it silently costs a gate. The previous pin was
      # on no branch at all, so this job could never check out — see the note on
      # the ref above.
      # The frontend is private: resolve its pins over SSH with the same
      # read-only deploy key the checkout uses (key only in RUNNER_TEMP, removed after).
      - name: Every pinned external ref must exist
        env:
          FRONTEND_DEPLOY_KEY: ${{ secrets.FRONTEND_DEPLOY_KEY }}
        run: |
          key="$RUNNER_TEMP/frontend_deploy_key"
          printf '%s\n' "$FRONTEND_DEPLOY_KEY" > "$key"; chmod 600 "$key"
          export GIT_SSH_COMMAND="ssh -i $key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
          git config --global url."git@github.com:DCSAITechnologies/dcs-games-frontend.git".insteadOf "https://github.com/DCSAITechnologies/dcs-games-frontend.git"
          rc=0; node scripts/verify-ci-pins.mjs || rc=$?
          rm -f "$key"; exit $rc
        working-directory: ${{ github.workspace }}
      - name: Speedhack regression must stay closed
        run: |
          cd netcode
          npm ci --no-audit --no-fund || npm install --no-audit --no-fund
          npm test
        env:
          DCS_SITE_DIR: ${{ github.workspace }}/frontend

  release:
    name: Release manifest
    runs-on: ubuntu-latest
    needs: [security, unit, schema, api, browser, netcode]
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund
      - run: node scripts/release-manifest.mjs
        env:
          # Without this the manifest is written to a sibling directory that
          # does not exist in CI, and the upload step below silently finds
          # nothing — a release artifact that was never produced, from a job
          # that reported success.
          DCS_RELEASE_MANIFEST_DIR: ${{ github.workspace }}
      - uses: actions/upload-artifact@v4
        with:
          name: release-manifest
          path: RELEASE_MANIFEST.json
        continue-on-error: true
